<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SightBridge</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>SightBridge</h1>
    <label class="toggle-switch">
      <input type="checkbox" id="powerToggle">
      <span class="slider round"></span>
    </label>
  </div>

  <div class="control-group">
    <label>Mode</label>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="protanopia">Protanopia</button>
      <button class="mode-btn" data-mode="deuteranopia">Deuteranopia</button>
      <button class="mode-btn" data-mode="both">Both</button>
    </div>
  </div>

  <div class="control-group">
    <label for="intensitySlider">Intensity <span id="intensityValue">100%</span></label>
    <input type="range" id="intensitySlider" min="25" max="100" step="25" value="100">
  </div>

  <script src="popup.js"></script>
</body>
</html>
